name: Live integration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

jobs:
  guardrail:
    runs-on: ubuntu-latest
    env:
      BRANTA_RUN_INTEGRATION: "1"
      BRANTA_INTEGRATION_METRICS_TOKEN: ${{ secrets.BRANTA_INTEGRATION_METRICS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Require integration metrics token
        run: |
          if [ -z "$BRANTA_INTEGRATION_METRICS_TOKEN" ]; then
            echo "Set the BRANTA_INTEGRATION_METRICS_TOKEN Actions secret to the same value as Guardrail."
            exit 1
          fi
      - name: Example QR codes against staging and production
        run: dotnet test -f net8.0 --filter FullyQualifiedName~ExampleQRCodes
      - name: Multi-rail round-trips (requires API key secret)
        env:
          BRANTA_API_KEY: ${{ secrets.BRANTA_API_KEY }}
        run: |
          if [ -z "$BRANTA_API_KEY" ]; then
            echo "Skipping MultiRailRoundTrip — set BRANTA_API_KEY Actions secret for POST coverage."
            exit 0
          fi
          dotnet test -f net8.0 --filter FullyQualifiedName~MultiRailRoundTrip
